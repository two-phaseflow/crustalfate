name: crustalfate
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.2.6
  - scipy=1.15.3
  - matplotlib=3.10.8
  - coolprop=7.2.0      # fluid properties for fig3.py: Water = IAPWS-95, CO2 = Span & Wagner (1996)
  - vtk=9.6.0           # only for reduce/reduce_vtu.py (reading the archived VTU output)
